[package]
name = "linxiv-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "linxiv_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order: serde_json Value/Map keep insertion order (IndexMap), so UserSettings::all()
# and any json! object byte-match Python's json.dump (insertion order), not alphabetical.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
thiserror = "2.0.18"
anyhow = "1.0.99"
chrono = { version = "0.4", features = ["serde"] }
# bundled = statically compiles SQLite with FTS5 + JSON1 (no system libsqlite3 dep).
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
directories = "6"
dotenvy = "0.15.7"
tracing = "0.1"
# .lxproj is a ZIP_DEFLATED archive (Python uses zipfile); deflate-only, no extras.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Sources: HTTP + async + XML/PDF/tar parsing. rustls-tls = no OpenSSL system dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "time"] }
# pdfium-render: native libpdfium for first-page text + Info dict. ~22x faster than
# lopdf on large PDFs (0.3s vs 6.8s on a 76-page/29MB PDF) with cleaner text (proper
# newlines). The native lib is fetched by scripts/fetch_pdfium.sh (D10). thread_safe
# holds a process-global lock per Pdfium instance lifetime, so extraction binds a
# short-lived per-call instance (see sources::pdf_metadata::bind_pdfium).
quick-xml = "0.40"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
tar = "0.4"
flate2 = "1"
# BibTeX import parser (pybtex's role). Used by formats::bibtex_import, shared by
# the CLI/MCP/app-router import paths.
biblatex = "0.12"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
