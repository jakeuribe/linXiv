[package]
name = "linxiv-p2p"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Phase 2: real keyhive_core/beekem capability layer
auth-keyhive = [
    "dep:beekem",
    "dep:keyhive_core",
    "dep:keyhive_crypto",
    "dep:ed25519-dalek",
    "dep:future_form",
    "dep:futures",
    "dep:nonempty",
    "dep:rand",
    "dep:serde",
]
# Phase 3: beelay-core sync over iroh (requires the capability layer)
sync-beelay = ["auth-keyhive", "dep:beelay-core", "dep:blake3", "dep:iroh-blobs"]

[dependencies]
automerge = "0.10.0"
iroh = "1.0.2"
iroh-tickets = "1.0.0"
n0-error = "1.0.0"
postcard = { version = "1", features = ["use-std"] }
# already an unconditional transitive dep via iroh; "time" for recv deadlines.
tokio = { version = "1", features = ["sync", "time"] }

# auth-keyhive (all optional). NB: keyhive uses ed25519-dalek 2.x while iroh
# uses 3.0-rc — different crates; key material crosses only as raw 32 bytes.
beekem = { version = "0.3.0", optional = true }
# sync-beelay: EXACT pin — a bare "beelay-core" resolves to a 0.0.1 placeholder.
beelay-core = { version = "=0.1.0-alpha.1", optional = true }
blake3 = { version = "1", optional = true }
# vendor-edit: fs-store for disk-backed blobs (BeelayNode data_dir).
iroh-blobs = { version = "0.103.0", optional = true, default-features = false, features = [
    "fs-store",
] }
ed25519-dalek = { version = "2", optional = true }
future_form = { version = "0.3.1", optional = true }
futures = { version = "0.3", optional = true }
keyhive_core = { version = "0.5.0", optional = true }
keyhive_crypto = { version = "0.2.1", optional = true }
nonempty = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
anyhow = "1.0.103"
# tests speak raw iroh in the wire-level spoof test; same version as the lib dep.
iroh = "1.0.2"
# tests forge a pre-3-state registry.bin in the bad-host-ticket test.
postcard = { version = "1", features = ["use-std"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
