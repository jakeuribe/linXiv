<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <script>
    // Pre-paint theme. The host (src/pages/GraphPage.tsx) resolves the live
    // theme with getColors() and freezes it into this document's src at mount
    // (see src/lib/graphIframeSrc.ts), so graph.html carries no palette of its
    // own -- the copy it used to hold went stale silently every time
    // src/lib/theme.ts gained a preset. Theme changes after load ride the
    // `theme_update` postMessage handled in graph.js. Opened standalone (no
    // ?theme=), graph.css's own var() fallbacks apply. VARS must list every
    // token getColors() resolves -- graph.css and graph.js's node colours read
    // --color-success / --color-danger too.
    //
    // ?mode= carries the light/dark half of the theme, which the eight colour
    // tokens do not encode. It drives `color-scheme`, the property
    // src/styles/tokens.css sets from [data-mode] so WebKitGTK draws native
    // controls (date pickers, checkboxes, sliders, the panel scrollbar) in our
    // chrome instead of the OS's. The iframe inherits none of that, so without
    // this it sat on the UA default of light inside every dark preset. Applied
    // before ?theme= and independently of it -- a malformed palette must not
    // take the scheme down with it.
    (function() {
        var VARS = ['bg', 'panel', 'border', 'accent', 'text', 'muted',
                    'success', 'danger'];
        var MODES = ['dark', 'light'];
        try {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode');
            if (MODES.indexOf(mode) !== -1) {
                document.documentElement.style.setProperty('color-scheme', mode);
            }
            var raw = params.get('theme');
            if (!raw) return;
            var colors = JSON.parse(raw);
            var r = document.documentElement;
            VARS.forEach(function(k) {
                if (typeof colors[k] === 'string' && colors[k]) {
                    r.style.setProperty('--color-' + k, colors[k]);
                }
            });
        } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="graph.css" />
    <script src="cytoscape.min.js"></script>
    <script src="d3.v7.min.js"></script>
</head>
<body>
    <div id="cy"></div>

    <!-- Hover inspector. Paper labels are ellipsized at 180px on the canvas, so
         a long title is unreadable without clicking through to the paper, and
         the category / published date / tags / PDF flag / abstract that
         `/api/graph` already sends for every paper (crates/core/src/graph.rs's
         PAPER_NODES_SQL selects url, doi and summary too) had no surface at all
         -- the payload was fetched and thrown away. Plain text set with
         textContent, never innerHTML: these strings are library metadata. -->
    <div id="node-tooltip" role="tooltip" aria-hidden="true" style="display:none">
        <div id="node-tooltip-title"></div>
        <div id="node-tooltip-meta"></div>
    </div>

    <!-- Filtered-to-nothing notice. The canvas is the one surface in the app
         with no "no results" state: a filter that matches nothing leaves either
         a blank rectangle ("Show highlighted only") or a field of 8% ghosts,
         and neither is distinguishable from a graph that failed to load. The
         host's own EmptyState overlay (src/pages/GraphPage.tsx) cannot cover
         this case -- it is `absolute inset-0`, so it would bury the very filter
         panels the user needs to undo it -- so the notice lives in here,
         centred in the strip #right-panels leaves uncovered. -->
    <div id="no-match-notice" role="status" aria-live="polite" aria-hidden="true" style="display:none">
        <div id="no-match-title"></div>
        <div id="no-match-body"></div>
        <!-- Second cause, when it applies: "Hide single-paper authors" is a
             HOST checkbox (src/pages/GraphPage.tsx) applied by the backend, so
             the authors it drops reach this document as neither a node nor an
             edge -- and the Filters > Author box matches against that edge
             list. The notice is where that becomes visible, and the checkbox
             is out of reach from inside the frame, so the button asks the host
             to clear it. -->
        <div id="no-match-hint" style="display:none"></div>
        <button id="no-match-show-authors" class="full-btn" style="display:none">Show single-paper authors</button>
        <button id="no-match-clear" class="full-btn">Clear all filters</button>
    </div>

    <!-- Both panels share the right-side column -->
    <div id="right-panels">

        <!-- Layout panel -->
        <div class="panel" id="controls">
            <div class="panel-header">
                <span>Layout</span>
                <button class="panel-toggle" data-target="controls-body">▼</button>
            </div>
            <div class="panel-body" id="controls-body">
                <div class="section-title">Forces</div>
                <div class="control-row">
                    <label>Center force</label>
                    <input type="range" id="centerForce" min="0" max="1" step="0.01" value="0.05" />
                    <span class="val" id="centerForceVal">0.05</span>
                </div>
                <div class="control-row">
                    <label>Repel force</label>
                    <input type="range" id="repelForce" min="0" max="1000" step="10" value="180" />
                    <span class="val" id="repelForceVal">180</span>
                </div>
                <div class="control-row">
                    <label>Link distance</label>
                    <input type="range" id="linkDistance" min="10" max="300" step="5" value="70" />
                    <span class="val" id="linkDistanceVal">70</span>
                </div>
                <div class="control-row">
                    <label>Link strength</label>
                    <input type="range" id="linkStrength" min="0" max="1" step="0.01" value="0.3" />
                    <span class="val" id="linkStrengthVal">0.3</span>
                </div>
                <div class="control-row">
                    <button id="relayout-btn" class="full-btn">Randomize &amp; restart</button>
                </div>
            </div>
        </div>

        <!-- Filters panel -->
        <div class="panel" id="filters">
            <div class="panel-header">
                <!-- The count of filters currently in force. This panel opens
                     COLLAPSED and its state outlives every navigation (AppShell
                     keeps the frame alive), so an active filter was a canvas of
                     8% ghosts with nothing on the header to say why -- see
                     _updateFilterBadges in graph.js. -->
                <span>Filters<span id="filter-active-count" class="panel-count"></span></span>
                <button class="panel-toggle" data-target="filters-body">▶</button>
            </div>
            <div class="panel-body" id="filters-body" style="display:none">

                <div class="section-title">Visibility</div>
                <div class="check-row">
                    <label><input type="checkbox" id="showPapers" checked> Papers</label>
                    <label><input type="checkbox" id="showAuthors" checked> Authors</label>
                    <label><input type="checkbox" id="showTags" checked> Tags</label>
                </div>

                <div class="section-title">Attributes</div>
                <div class="filter-row">
                    <label>Category</label>
                    <input type="text" id="filterCategory" list="categoryList" placeholder="type to filter…">
                    <datalist id="categoryList"></datalist>
                </div>
                <div class="check-row">
                    <label><input type="checkbox" id="filterHasPdf"> Has PDF only</label>
                </div>

                <!-- type=date, as the rest of the app enters dates
                     (PaperMetadataEditor). These were free text: the filter
                     applies 280ms after each keystroke and compares the raw
                     string, so typing "2024-01-05" walked the graph through
                     "2", "20", "202"... each a live filter over every paper,
                     and a typo like "05/01/2024" filtered silently and
                     wrongly with nothing to say so. A date input's value is
                     either "" or a valid YYYY-MM-DD, which is exactly what the
                     comparison downstream assumes. -->
                <div class="section-title">Date range</div>
                <div class="filter-row">
                    <label>From</label>
                    <input type="date" id="filterDateFrom">
                </div>
                <div class="filter-row">
                    <label>To</label>
                    <input type="date" id="filterDateTo">
                </div>

                <div class="section-title">Highlight</div>
                <div class="filter-row">
                    <label>Title</label>
                    <input type="text" id="filterTitle" placeholder="e.g. transformer">
                </div>
                <div class="filter-row">
                    <label>Author</label>
                    <input type="text" id="filterAuthor" placeholder="e.g. Hinton">
                </div>

                <button id="isolate-btn" class="full-btn toggle-btn">Show highlighted only</button>
                <button id="clear-filters-btn" class="full-btn">Clear all filters</button>
            </div>
        </div>

        <!-- Tag Filter panel -->
        <div class="panel" id="tag-filter-panel">
            <div class="panel-header">
                <span>Tag Filter<span id="tag-filter-active-count" class="panel-count"></span></span>
                <button class="panel-toggle" data-target="tag-filter-body">▶</button>
            </div>
            <div class="panel-body" id="tag-filter-body" style="display:none">

                <div class="section-title">Projects</div>
                <div class="tag-input-row">
                    <input type="text" id="filterProject" list="projectList" placeholder="type a project…" autocomplete="off">
                    <datalist id="projectList"></datalist>
                    <button id="addProjectBtn" class="add-filter-btn" title="Add project filter">+</button>
                </div>
                <div id="project-filter-rows"></div>
                <div id="project-filter-empty" class="filter-empty">No project filters active.</div>

                <div class="section-title">Project Tags</div>
                <div class="tag-input-row">
                    <input type="text" id="filterProjectTag" list="projectTagList" placeholder="type a tag…" autocomplete="off">
                    <datalist id="projectTagList"></datalist>
                    <button id="addProjTagBtn" class="add-filter-btn" title="Add project tag filter">+</button>
                </div>
                <div id="proj-tag-filter-rows"></div>
                <div id="proj-tag-filter-empty" class="filter-empty">No project tag filters active.</div>

                <div class="section-title">Paper Tags</div>
                <div class="tag-input-row">
                    <input type="text" id="tagFilterInput" list="tagList"
                           placeholder="type a tag…" autocomplete="off">
                    <datalist id="tagList"></datalist>
                    <button id="addTagBtn" class="add-filter-btn" title="Add tag">+</button>
                </div>
                <div id="tag-filter-rows"></div>
                <div id="tag-filter-empty" class="filter-empty">
                    No tag filters active.
                </div>
            </div>
        </div>

        <!-- Selection panel -->
        <div class="panel" id="selection-panel">
            <div class="panel-header">
                <span>Selection <span id="selectionCount">(0)</span></span>
                <button class="panel-toggle" data-target="selection-body">▶</button>
            </div>
            <div class="panel-body" id="selection-body" style="display:none">
                <div class="check-row" style="margin-bottom:8px;">
                    <span class="panel-hint">Click to select · Ctrl+click to add</span>
                </div>
                <button id="select-all-btn" class="full-btn" style="margin-top:0;">Select all visible</button>
                <button id="clear-selection-btn" class="full-btn">Clear selection</button>
            </div>
        </div>

    </div><!-- end #right-panels -->

    <script src="graph.js"></script>
</body>
</html>
