name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            args: "--bundles deb,appimage,rpm"
          - os: macos-latest
            platform: macos-arm64
            args: ""
          - os: macos-15-intel
            platform: macos-x86_64
            args: ""
          - os: windows-latest
            platform: windows-x86_64
            # WiX/MSI's ProductVersion is strictly numeric (major.minor.build,
            # 0-65535) and rejects alphabetic prerelease tags like "-beta" or
            # "-rc.1". NSIS has no such restriction, so prereleases build
            # NSIS-only; stable tags (no hyphen) still build both.
            args: ${{ contains(github.ref_name, '-') && '--bundles nsis' || '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # crates/p2p is a git submodule; ci.yml already does this.
          submodules: recursive

      # The tag lands verbatim in the RPM Version field, where a "-beta" suffix
      # sorts ABOVE the bare core (rpm's only prerelease marker is "~"), so a
      # stable tag sharing a core with a shipped prerelease can never rpm -U
      # over it. After v0.3.0-beta the next release is v0.3.1 — see docs/build.md.
      - name: Set app version from tag
        shell: bash
        run: bash scripts/set_release_version.sh "$GITHUB_REF_NAME"

      - name: Refuse to release without real updater signing set up
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q "REPLACE_WITH_TAURI_SIGNER_GENERATE_PUBLIC_KEY" src-tauri/tauri.conf.json; then
            echo "::error::src-tauri/tauri.conf.json still has the placeholder updater pubkey." \
                 "Run 'npm run tauri signer generate', paste the public key into" \
                 "plugins.updater.pubkey, and set the TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)" \
                 "repo secrets before cutting a release."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY repo secret is not set." \
                 "createUpdaterArtifacts requires it to build at all."
            exit 1
          fi

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Native libpdfium for the in-process backend (CLI/MCP/app all link core).
      - name: Fetch pdfium
        run: bash scripts/fetch_pdfium.sh

      - name: Stage Rust CLI/MCP binaries
        run: npm run build:sidecar

      - name: Build Tauri app and publish to GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update-artifact signing (independent of Apple codesigning / Windows
          # Authenticode — this only covers the in-place updater's payloads).
          # Losing TAURI_SIGNING_PRIVATE_KEY is permanent: keep an offline copy.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "linXiv ${{ github.ref_name }}"
          releaseDraft: true
          # Semver convention (matches compareVersions() in src/api/updates.ts):
          # a hyphen marks a pre-release tag (vX.Y.Z-beta, vX.Y.Z-rc.1, ...).
          # GitHub's /releases/latest API -- what both the updater plugin and
          # apply_linux_package_update query -- skips prereleases, so tagging a
          # beta this way keeps it from being offered to everyone as "the
          # latest version" the moment it's published.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          # We ship both NSIS and MSI; the updater's latest.json can only name
          # one Windows artifact, so pin it to NSIS (passive installMode above).
          updaterJsonPreferNsis: true
          # macOS and Windows builds are unsigned. See README.md's Install
          # section for the current per-OS bypass steps (Gatekeeper's "damaged"
          # message on macOS 15+, SmartScreen on Windows).

      # Raw per-platform binaries for the linxiv PyPI wheels
      # (linxiv-dev/linxiv-pypi downloads these by tag and bundles them).
      #
      # These are NOT uploaded here. A release asset list is ordered by upload
      # time, and every matrix job would slot its two raw binaries in among its
      # own installers -- so the page read deb, rpm, AppImage, two binaries,
      # dmg, two binaries, msi, exe, two binaries. Someone looking for the
      # installer for their platform had to step over developer artifacts to
      # find it. Hand them to a job that runs after the whole matrix instead,
      # so every installer is already up before the first binary lands.
      - name: Stage raw app/CLI binaries
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          exe=""; case "$triple" in *windows*) exe=".exe" ;; esac
          mkdir -p raw-binaries
          cp "src-tauri/target/release/linxiv-app$exe" "raw-binaries/raw-linxiv-app-$triple$exe"
          cp "src-tauri/target/release/linxiv-cli$exe" "raw-binaries/raw-linxiv-cli-$triple$exe"

      - name: Hand the raw binaries to the upload job
        uses: actions/upload-artifact@v7
        with:
          name: raw-binaries-${{ matrix.platform }}
          path: raw-binaries/
          if-no-files-found: error
          retention-days: 1

  build-arch:
    name: Build (linux-x86_64-pacman)
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      # The job container starts intentionally small. Install git/node before
      # checkout and the native libraries before the Tauri build.
      - name: Install Arch build dependencies
        run: |
          for i in 1 2 3; do
            pacman -Syyu --noconfirm --needed \
              curl file git glib2 gtk3 libappindicator librsvg nodejs npm openssl \
              patchelf rustup webkit2gtk-4.1 wget xdotool && exit 0
            echo "pacman failed (attempt $i/3), likely mirror lag; retrying in 30s..."
            sleep 30
          done
          exit 1

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set app and package version from tag
        run: bash scripts/set_release_version.sh "$GITHUB_REF_NAME"

      # makepkg refuses to run as root, while GitHub job containers default to
      # root. Build as an unprivileged account after dependency installation.
      - name: Build native Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder bash -c '
            rustup default stable
            npm ci
            npm run build:arch
          '

      - uses: actions/upload-artifact@v7
        with:
          name: linxiv-arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  # Runs only once every build job has finished, which is what puts the raw
  # binaries at the BOTTOM of the release asset list rather than interleaved.
  # Keep this job last: anything uploaded after it lands below it too.
  upload-raw-binaries:
    name: Upload raw binaries
    needs: [build, build-arch]
    # fail-fast is off above so one broken platform still ships the others'
    # installers. Run on a partial matrix for the same reason: withholding
    # every binary because one runner died would be worse than the old
    # per-job upload this replaces.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Collect the native Arch package
        if: ${{ needs.build-arch.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: linxiv-arch-package
          path: arch-package

      - name: Upload the native Arch package
        if: ${{ needs.build-arch.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" arch-package/*.pkg.tar.zst --clobber

      - name: Collect every platform's binaries
        uses: actions/download-artifact@v4
        with:
          pattern: raw-binaries-*
          merge-multiple: true
          path: raw-binaries

      # tauri-action created the draft release; gh finds drafts by tag.
      # No checkout here, so gh needs the repo named explicitly.
      - name: Upload raw app/CLI binaries to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(raw-binaries/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::no raw binaries were produced — every build job failed"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
