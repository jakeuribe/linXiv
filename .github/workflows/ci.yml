name: CI

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

jobs:
  rust:
    name: Rust (cargo test + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 2 system deps (the linxiv-app crate links webkit2gtk).
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      # Native libpdfium for the PDF-extraction tests.
      - name: Fetch pdfium
        run: bash scripts/fetch_pdfium.sh
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
