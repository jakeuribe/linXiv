name: CI

on:
  push:
    # main pushes establish the code-coverage baseline PRs are compared against.
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  rust:
    name: Rust (cargo test + fmt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write # actions/upload-code-coverage
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview: source-based coverage for cargo-llvm-cov.
          components: rustfmt,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 2 system deps (the linxiv-app crate links webkit2gtk).
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      # Native libpdfium for the PDF-extraction tests.
      - name: Fetch pdfium
        run: bash scripts/fetch_pdfium.sh
      # linxiv-app's tauri-build validates the externalBin sidecar paths at
      # compile time, so they must exist before cargo test builds the app.
      - name: Stage Rust CLI/MCP sidecar binaries
        run: bash scripts/stage_rust_bins.sh
      - uses: taiki-e/install-action@cargo-llvm-cov
      # llvm-cov runs the same `cargo test --workspace` under coverage
      # instrumentation — one run doubles as the test gate and the report.
      - name: cargo test (with coverage)
        working-directory: src-tauri
        run: cargo llvm-cov --workspace --cobertura --output-path coverage.xml
      - name: Upload coverage (GitHub Code Quality)
        uses: actions/upload-code-coverage@v1
        with:
          file: src-tauri/coverage.xml
          language: Rust
          label: code-coverage/cargo-llvm-cov
        # Coverage upload needs Code Quality enabled on the repo; don't let a
        # preview-feature hiccup fail the test job.
        continue-on-error: true
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

  frontend:
    name: Frontend (tsc + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm test uses --experimental-transform-types, which needs Node 22+.
          node-version: "22"
      - run: npm ci
      # `npm run build` is `tsc && vite build`; the bundle step catches module
      # resolution a --noEmit typecheck passes over (subpath exports, dep majors).
      - run: npm run build
      - run: npm test
